[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-gpu"
version = "0.0.0"
description = "Deterministic GPU correctness assay."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "assay-gpu contributors" }]
dependencies = [
    "cryptography==44.0.3",
    "numpy==2.4.6",
    "torch",
    "typer",
]

[project.scripts]
assay = "assay.cli:app"

[project.urls]
Homepage = "https://github.com/assay-gpu/assay-gpu"

[dependency-groups]
test = [
    "pytest",
]
dev = [
    { include-group = "test" },
    "mypy",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "BLE",
    "C4",
    "E",
    "F",
    "I",
    "ICN",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "SLOT",
    "T20",
    "UP",
    "W",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "cpu: tests that run on CPU in CI",
    "gpu: tests that require a GPU; skipped in CI, run manually",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
extra_checks = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true
